<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b3847">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stand Assess">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<title>JE Stand Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: shop-floor field tool. Sticky steel header; phones get a bottom tab bar, a sticky stand switcher and section tabs; desktop adds a stand list rail. Report is a paper document. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#17202b; --muted:#5b6777; --line:#d3d9e0; --line-strong:#aab4c0;
  --steel:#2b3847; --steel-2:#33414f; --steel-line:#485767; --on-steel:#eef2f6; --on-steel-muted:#b9c3cf;
  --accent:#fcc23d; --accent-ink:#1a1400; --accent-soft:#fff4d6;
  --ok:#1f7a4d; --ok-soft:#e1f3e9; --bad:#b42318; --bad-soft:#fde7e5; --warn:#a15c00; --warn-soft:#fff0d6;
  --gray:#5b6777; --gray-soft:#e8ecf0; --focus:#1b6fd1; --scrim:rgba(10,14,20,.55);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#18202a; --ink:#e7ecf1; --muted:#9aa6b4; --line:#2a3440; --line-strong:#3b4756;
  --steel:#0a0f14; --steel-2:#18212b; --steel-line:#2c3846; --on-steel:#eef2f6; --on-steel-muted:#9aa6b4;
  --accent:#fcc23d; --accent-ink:#1a1400; --accent-soft:#3a2f0a;
  --ok:#4cc38a; --ok-soft:#123222; --bad:#ff7a6e; --bad-soft:#3b1714; --warn:#f0a840; --warn-soft:#3a2809;
  --gray:#a5b0bd; --gray-soft:#232c37; --focus:#6aa8ff; --scrim:rgba(0,0,0,.65); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#18202a; --ink:#e7ecf1; --muted:#9aa6b4; --line:#2a3440; --line-strong:#3b4756;
  --steel:#0a0f14; --steel-2:#18212b; --steel-line:#2c3846; --on-steel:#eef2f6; --on-steel-muted:#9aa6b4;
  --accent:#f2b705; --accent-ink:#1a1400; --accent-soft:#3a2f08;
  --ok:#4cc38a; --ok-soft:#123222; --bad:#ff7a6e; --bad-soft:#3b1714; --warn:#f0a840; --warn-soft:#3a2809;
  --gray:#a5b0bd; --gray-soft:#232c37; --focus:#6aa8ff; --scrim:rgba(0,0,0,.65); color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--steel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.eyebrow{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--steel);color:var(--on-steel);border-bottom:4px solid var(--accent)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-logo{height:34px;width:auto;flex:none;display:block}
.brand h1{font-size:22px;color:var(--on-steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.2 var(--f-body);color:var(--on-steel-muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:1px solid var(--steel-line);color:var(--on-steel);padding:8px 14px;border-radius:6px;font-weight:600;min-height:40px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .ti{display:none}
.chip-sync{display:inline-flex;align-items:center;gap:6px;background:var(--steel-2);border:1px solid var(--steel-line);color:var(--on-steel);padding:6px 10px;border-radius:999px;font:600 13px/1 var(--f-body);white-space:nowrap}
.chip-sync i{width:8px;height:8px;border-radius:50%;background:var(--on-steel-muted);display:inline-block}
.chip-sync.ok i{background:#4cc38a}.chip-sync.busy i{background:var(--accent)}.chip-sync.off i{background:#ff7a6e}
.iconbtn{background:var(--steel-2);border:1px solid var(--steel-line);color:var(--on-steel);border-radius:6px;min-width:40px;min-height:40px;font-weight:700;font-size:18px;line-height:1}

/* layout */
.wrap{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}

/* forms */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:10px;min-height:46px;width:100%;font-size:16px}
.field textarea{min-height:84px;resize:vertical}
.field.wide{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:10px 14px;font-weight:700;min-height:46px;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:700 12px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.pill.red{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.yellow{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.gray{background:var(--gray-soft);color:var(--gray);border-color:var(--gray)}
.pill.green{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pill.none{background:var(--gray-soft);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line-strong);display:inline-block;flex:none}
.dot.red{background:var(--bad)}.dot.yellow{background:var(--warn)}.dot.gray{background:var(--gray)}.dot.green{background:var(--ok)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;border-top:6px solid var(--line-strong)}
.tile b{display:block;font:700 32px/1 var(--f-display)}
.tile span{font-size:13px;color:var(--muted)}
.tile.red{border-top-color:var(--bad)}.tile.yellow{border-top-color:var(--warn)}.tile.gray{border-top-color:var(--gray)}.tile.green{border-top-color:var(--ok)}

/* assessment list */
.alist{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .t{font-weight:700}.arow .m{font-size:13px;color:var(--muted)}
.arow .dots{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.arow[aria-current="true"] .t::after{content:"  · open";color:var(--muted);font-weight:500}

/* stands layout */
.grid2{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,64px) + 12px)}
.slist{display:flex;flex-direction:column;max-height:calc(100vh - 220px);overflow:auto}
.sitem{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.sitem[aria-current="true"]{background:var(--accent-soft)}
.sitem .bar{width:10px;height:34px;border-radius:3px;background:var(--line-strong)}
.sitem .bar.red{background:var(--bad)}.sitem .bar.yellow{background:var(--warn)}.sitem .bar.gray{background:var(--gray)}.sitem .bar.green{background:var(--ok)}
.sname{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smeta{display:block;font-size:13px;color:var(--muted)}
.spct{font:500 12px var(--f-mono);color:var(--muted)}

.sticky-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,64px));z-index:20;background:var(--bg);padding-block:10px 8px;margin-top:-6px}
.switch{display:none;grid-template-columns:44px minmax(0,1fr) 44px auto;gap:6px;align-items:center;margin-bottom:8px}
.switch select{min-height:46px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);padding:0 10px;font-weight:700;width:100%;font-size:16px}
.switch .nav{min-height:46px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);font-size:20px;font-weight:700}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.shead h2{font-size:22px;min-width:0}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none;border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;min-height:40px;white-space:nowrap}
.subtab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.subtab .n{font:500 12px var(--f-mono);opacity:.8;margin-left:4px}
.progress{height:6px;background:var(--gray-soft);border-radius:999px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}

/* measurements */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mfield{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.mfield label{font-size:14px;font-weight:700}
.minput{display:flex;align-items:center;gap:6px}
.minput input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;background:var(--panel);font-family:var(--f-mono);font-size:18px;min-height:46px}
.unit{font:500 13px var(--f-mono);color:var(--muted);min-width:28px}
.mres{display:flex;flex-direction:column;gap:3px}
.mres span{font-size:12.5px;line-height:1.3;padding:3px 6px;border-radius:4px;background:var(--gray-soft)}
.mres .pass{background:var(--ok-soft);color:var(--ok)}.mres .fail{background:var(--bad-soft);color:var(--bad)}

/* checklist */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.fchip{border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;min-height:38px}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.group{margin-top:18px}
.group-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.group-h h3{font-size:20px}
.group-h .std{font:500 12.5px var(--f-mono);color:var(--muted)}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.item-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iid{font:700 13px var(--f-mono);color:var(--muted)}
.cite{font:500 13px var(--f-mono);background:var(--gray-soft);padding:2px 6px;border-radius:4px}
.sevtag{font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.sevtag.red{background:var(--bad-soft);color:var(--bad)}.sevtag.yellow{background:var(--warn-soft);color:var(--warn)}
.req{margin:0}
.how summary{font-size:14px;color:var(--muted);cursor:pointer;font-weight:600;padding:4px 0;list-style-position:inside}
.how p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.auto{font-size:13px;padding:4px 8px;border-radius:4px;background:var(--gray-soft);align-self:flex-start}
.auto.pass{background:var(--ok-soft);color:var(--ok)}.auto.fail{background:var(--bad-soft);color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;max-width:440px}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);min-height:50px;font-weight:800;font-size:15px}
.seg button:last-child{border-right:0}
.seg button span{display:block;font:500 10.5px var(--f-body);letter-spacing:.02em;opacity:.8}
.seg button[aria-pressed="true"][data-s="C"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-s="NC"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-s="UV"]{background:var(--gray);color:#fff}
.seg button[aria-pressed="true"][data-s="NA"]{background:var(--ink);color:var(--panel)}
.extra{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:8px}
.extra textarea{min-height:46px;border:1px solid var(--line-strong);border-radius:8px;padding:9px;background:var(--bg);width:100%;resize:vertical;font-size:16px}
.extra select{border:1px solid var(--line-strong);border-radius:8px;padding:8px;background:var(--bg);min-height:46px;font-size:15px}
.itools{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--focus);font-weight:700;font-size:14px;padding:6px 0;min-height:36px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;min-width:0}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--gray-soft)}
.photo input{border:0;border-top:1px solid var(--line);padding:8px;background:var(--panel);font-size:15px;width:100%}
.photo .pf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);background:var(--panel);padding:0 8px}
.photo .pf small{color:var(--muted);font-size:12px}
.photo button{border:0;background:none;color:var(--bad);padding:8px 0;font-size:14px;font-weight:600}

/* report */
.report-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.report-scroll{overflow-x:auto}
.report{background:#fff;color:#141a22;max-width:8.5in;margin:0 auto;padding:clamp(18px,5vw,.6in);border:1px solid var(--line);border-radius:4px;font-size:10.5pt;line-height:1.45}
.report h1{font:700 26pt/1.1 var(--f-display);color:#141a22}
.report h2{font:700 16pt/1.15 var(--f-display);margin:20pt 0 8pt;padding-bottom:4pt;border-bottom:2pt solid #141a22;color:#141a22}
.report h3{font:700 12.5pt/1.2 var(--f-display);margin:12pt 0 6pt;color:#141a22}
.report p{margin:0 0 8pt}
.report .tw{overflow-x:auto}
.report table{width:100%;border-collapse:collapse;margin:6pt 0 10pt;font-size:9pt}
.report th,.report td{border:1px solid #b8c0ca;padding:4pt 5pt;text-align:left;vertical-align:top}
.report th{background:#eef1f4;font-weight:700}
.report table.uvt{font-size:8pt}.report table.uvt td,.report table.uvt th{padding:2pt 4pt}
.report .rbar{height:8pt;background:repeating-linear-gradient(-45deg,#fcc23d 0 8pt,#141a22 8pt 16pt);margin-bottom:14pt}
.report .kv{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:2pt 12pt;font-size:10pt}
.report .kv dt{font-weight:700}.report .kv dd{margin:0}
.report .r-red{color:#b42318;font-weight:700}.report .r-yellow{color:#a15c00;font-weight:700}.report .r-gray{color:#4b5563;font-weight:700}.report .r-green{color:#1f7a4d;font-weight:700}
.report .rphotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6pt}
.report .rphotos figure{margin:0}.report .rphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #b8c0ca}
.report .rphotos figcaption{font-size:8pt;color:#4b5563}
.report .small{font-size:8.5pt;color:#4b5563}
.report .sign{display:grid;grid-template-columns:1fr 1fr;gap:24pt;margin-top:24pt}
.report .sign div{border-top:1px solid #141a22;padding-top:4pt;font-size:9pt}
.report .mono{font-family:var(--f-mono)}
.report.pdfmode{width:7.5in;max-width:none;padding:0;border:0;border-radius:0}
.report.pdfmode .tw{overflow:visible}
#pdf-host{position:fixed;left:-10000px;top:0;width:7.5in;background:#fff}

/* modal, sheet, toast */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:var(--panel);border-radius:12px;padding:20px;max-width:440px;width:100%;border:1px solid var(--line)}
.modal .box p{margin:8px 0 16px}
.sheet{position:fixed;inset:0;background:var(--scrim);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--panel);border-radius:14px 14px 0 0;width:100%;max-width:520px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.sheet .btn{width:100%;justify-content:flex-start}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:70;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* phones and small tablets */
@media (max-width:900px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .switch{display:grid}
}
@media (max-width:760px){
  .brand small{display:none}
  .brand h1{font-size:20px}
  .brand-logo{height:28px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--steel);border-top:1px solid var(--steel-line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}

ace of the highest step or platform"}, {"key": "baseMin", "label": "Shortest base dimension", "unit": "in", "tags": ["mobile"], "hint": "Outside of caster/foot to outside, narrowest direction"}, {"key": "stepWidth", "label": "Narrowest step width", "unit": "in", "tags": ["mobile"]}, {"key": "riseMax", "label": "Largest step rise", "unit": "in", "tags": ["mobile"]}, {"key": "riseMin", "label": "Smallest step rise", "unit": "in", "tags": ["mobile"]}, {"key": "depthMin", "label": "Shallowest step depth", "unit": "in", "tags": ["mobile"]}, {"key": "stringerAngle", "label": "Step stringer slope", "unit": "deg", "tags": ["mobile"], "hint": "Measured from horizontal"}, {"key": "stepRail", "label": "Step handrail height", "unit": "in", "tags": ["mobile_ge4"], "hint": "Vertical, from front edge of step"}, {"key": "topDepth", "label": "Top step depth, front to back", "unit": "in", "tags": ["MS_gt10"]}, {"key": "topRail", "label": "Top step handrail height", "unit": "in", "tags": ["MS_gt10"]}, {"key": "platRail", "label": "Platform top rail height", "unit": "in", "tags": ["MP", "FP_ge4"], "hint": "Deck surface to top of top rail"}, {"key": "midRail", "label": "Midrail height", "unit": "in", "tags": ["MP", "FP_ge4"]}, {"key": "maxOpening", "label": "Largest rail opening", "unit": "in", "tags": ["guardrail"], "hint": "Largest clear gap between rail members"}, {"key": "toeH", "label": "Toeboard height", "unit": "in", "tags": ["toeboard"]}, {"key": "toeGap", "label": "Gap under toeboard", "unit": "in", "tags": ["toeboard"]}, {"key": "mil", "label": "Maximum intended load", "unit": "lb", "tags": ["mobile"], "hint": "People + tools + parts, as stated by the customer"}, {"key": "unitWt", "label": "Unit weight (est.)", "unit": "lb", "tags": ["mobile"]}, {"key": "casters", "label": "Number of casters", "unit": "ea", "tags": ["mobile"]}, {"key": "casterRating", "label": "Rated load per caster", "unit": "lb", "tags": ["mobile"], "hint": "From caster marking or catalog; leave blank if unknown"}, {"key": "stairAngle", "label": "Stair angle", "unit": "deg", "tags": ["FP_stairs", "FP_ship"]}, {"key": "stairRise", "label": "Largest stair riser", "unit": "in", "tags": ["FP_stairs", "FP_ship"]}, {"key": "stairTread", "label": "Smallest tread depth", "unit": "in", "tags": ["FP_stairs", "FP_ship"]}, {"key": "stairWidth", "label": "Stair width between barriers", "unit": "in", "tags": ["FP_stairs", "FP_ship"]}, {"key": "handrailH", "label": "Stair handrail height", "unit": "in", "tags": ["FP_stairs"], "hint": "From leading edge of tread"}, {"key": "stairRailH", "label": "Stair rail system height", "unit": "in", "tags": ["FP_stairs"]}, {"key": "landingDepth", "label": "Landing depth", "unit": "in", "tags": ["FP_stairs"]}, {"key": "rungSpacing", "label": "Rung spacing (max)", "unit": "in", "tags": ["FP_ladder"], "hint": "Centerline to centerline"}, {"key": "rungWidth", "label": "Rung clear width", "unit": "in", "tags": ["FP_ladder"]}, {"key": "rungBehind", "label": "Clearance behind rungs", "unit": "in", "tags": ["FP_ladder"]}, {"key": "railExt", "label": "Side rail extension above landing", "unit": "in", "tags": ["FP_ladder"]}, {"key": "workGap", "label": "Largest work-side gap", "unit": "in", "tags": ["inpos"], "hint": "Deck edge to the equipment surface, at the widest point in each working position"}], "items": [{"id": "A1", "g": "A", "cite": "1910.22(a)(3)", "tags": ["all"], "sev": "yellow", "req": "Walking-working surfaces are free of hazards such as sharp or protruding objects, loose boards or plates, corrosion, leaks and spills.", "check": "Walk the deck and steps. Run a gloved hand along deck edges and rails. Note loose deck plate, trip edges and corrosion."}, {"id": "A2", "g": "A", "cite": "1910.22(b)", "tags": ["all"], "sev": "red", "req": "Each walking-working surface can support the maximum intended load for that surface.", "check": "Ask for a rated capacity, drawings or calculations. With no design data, rate Unable to verify and recommend a PE review or proof-load test."}, {"id": "A3", "g": "A", "cite": "1910.22(c)", "tags": ["all"], "sev": "yellow", "req": "A safe means of access and egress to and from the surface is provided and used.", "check": "Confirm workers reach the deck by the unit's own steps, stairs or ladder, not by climbing rails, frames or the aircraft or part."}, {"id": "A4", "g": "A", "cite": "1910.22(d)(1)", "tags": ["all"], "sev": "yellow", "req": "Surfaces are inspected regularly and as necessary, and kept in a safe condition.", "check": "Ask for inspection records, checklists or tags. Note the interval and who performs it."}, {"id": "A5", "g": "A", "cite": "1910.22(d)(2)", "tags": ["all"], "sev": "red", "req": "Hazardous conditions are corrected or repaired before the surface is used again, or guarded to prevent use until repaired.", "check": "Look for known defects on units still in service. Ask whether damaged units are pulled from use."}, {"id": "A6", "g": "A", "cite": "1910.22(d)(3)", "tags": ["all"], "sev": "yellow", "req": "Any correction or repair involving structural integrity is performed or supervised by a qualified person.", "check": "Identify field repairs, added welds, splices or bolted patches. Ask who performed them and whether it was documented."}, {"id": "B1", "g": "B", "cite": "1910.23(b)(1)", "tags": ["ladder"], "sev": "yellow", "auto": "uniformRise", "req": "Steps, rungs and cleats are parallel, level and uniformly spaced when the unit is in position for use.", "check": "Measure every rise. The app shows the spread between the largest and smallest rise; judge uniformity from it."}, {"id": "B2", "g": "B", "cite": "1910.23(b)(6)", "tags": ["ladder"], "sev": "yellow", "req": "Metal ladders are made of corrosion-resistant material or protected against corrosion.", "check": "Note bare steel, flaking coating, rust scale and pitting, especially at welds and the base."}, {"id": "B3", "g": "B", "cite": "1910.23(b)(7)", "tags": ["ladder"], "sev": "yellow", "req": "Ladder surfaces are free of puncture and laceration hazards.", "check": "Check for burrs, sharp sheared edges, exposed bolt threads and weld spatter on grip and step surfaces."}, {"id": "B4", "g": "B", "cite": "1910.23(b)(8)", "tags": ["ladder"], "sev": "yellow", "req": "Ladders are used only for the purposes for which they were designed.", "check": "Interview users and watch the work. Note standing on rails, bridging to other structures or hanging loads."}, {"id": "B5", "g": "B", "cite": "1910.23(b)(9)", "tags": ["ladder"], "sev": "yellow", "req": "Ladders are inspected before initial use in each work shift, and more often as necessary.", "check": "Ask whether a pre-use check is done each shift and what it covers."}, {"id": "B6", "g": "B", "cite": "1910.23(b)(10)", "tags": ["ladder"], "sev": "red", "req": "Any unit with structural or other defects is immediately tagged \"Dangerous: Do Not Use\" and removed from service until repaired per 1910.22(d), or replaced.", "check": "Confirm a tag-out practice exists. If you find a structural defect, tell the site contact before you leave."}, {"id": "C1", "g": "C", "cite": "1910.23(e)(1)(i)", "tags": ["mobile"], "sev": "yellow", "auto": "stepWidth", "req": "Mobile ladder stands and platforms have a step width of at least 16 inches.", "check": "Measure the clear width of the narrowest step."}, {"id": "C2", "g": "C", "cite": "1910.23(e)(1)(ii)", "tags": ["mobile"], "sev": "yellow", "req": "Steps and platforms are slip resistant, by design or by a secondary process such as dimpling, knurling, coating or durable slip-resistant tape.", "check": "Check every step and the deck. Worn-smooth diamond plate or missing tape counts against this item."}, {"id": "C3", "g": "C", "cite": "1910.23(e)(1)(iii)", "tags": ["mobile"], "sev": "red", "req": "Mobile ladder stands and platforms can support at least four times their maximum intended load.", "check": "Needs design calculations or a proof-load test. Without them, rate Unable to verify."}, {"id": "C4", "g": "C", "cite": "1910.23(e)(1)(iv)", "tags": ["mobile"], "sev": "red", "auto": "casters", "req": "Wheels or casters under load can support their proportional share of four times the maximum intended load, plus their share of the unit's weight.", "check": "Record caster count and rated load. The app computes the required rating per caster: (4 x MIL + unit weight) / number of casters."}, {"id": "C5", "g": "C", "cite": "1910.23(e)(1)(v)", "tags": ["mobile_ge4"], "sev": "red", "auto": "stepRail", "req": "Units with a top step 4 ft or higher have handrails 29.5 to 37 inches high, measured vertically from the front edge of a step. Chains or removable gates may substitute only in special-use applications.", "check": "Measure handrail height at the nosing of several steps."}, {"id": "C6", "g": "C", "cite": "1910.23(e)(1)(vi)", "tags": ["mobile"], "sev": "red", "auto": "baseRatio", "req": "Maximum work-surface height does not exceed four times the shortest base dimension without additional support. Greater heights need outriggers, counterweights or comparable stabilizing means.", "check": "Measure the narrowest base dimension. The app compares it to the work-surface height. If outriggers or counterweights are fitted and in use, rate C and note them."}, {"id": "C7", "g": "C", "cite": "1910.23(e)(1)(vii)", "tags": ["mobile"], "sev": "red", "req": "Units with wheels or casters have a system to impede horizontal movement when an employee is on the unit.", "check": "Confirm caster brakes or floor locks are present on every caster or by a step-to-lock system, and that each one engages."}, {"id": "C8", "g": "C", "cite": "1910.23(e)(1)(viii)", "tags": ["mobile"], "sev": "red", "req": "No mobile ladder stand or platform moves when an employee is on it.", "check": "With locks engaged, push firmly at deck height from the floor. Any roll or walk is a finding. Ask whether units are ever moved occupied."}, {"id": "C9", "g": "C", "cite": "1910.23(e)(2)(i)", "tags": ["MS"], "sev": "yellow", "auto": "steps", "req": "Steps are uniformly spaced with a rise of no more than 10 inches and a depth of at least 7 inches. Step stringer slope is no more than 60 degrees from horizontal.", "check": "Measure largest rise, shallowest depth and stringer angle."}, {"id": "C10", "g": "C", "cite": "1910.23(e)(2)(ii)", "tags": ["MS_gt10"], "sev": "red", "auto": "topRail", "req": "Stands with a top step above 10 ft have the top step protected on three sides by a handrail at least 36 inches high. Removable gates or chains may substitute only in special-use applications.", "check": "Confirm rails on three sides of the top step and measure their height."}, {"id": "C11", "g": "C", "cite": "1910.23(e)(2)(ii)", "tags": ["MS_gt10_deep"], "sev": "yellow", "req": "Top steps 20 inches or more front to back also have a midrail and toeboard.", "check": "Confirm a midrail and toeboard around the top step."}, {"id": "C12", "g": "C", "cite": "1910.23(e)(2)(iii)", "tags": ["MS"], "sev": "red", "req": "The standing area of a mobile ladder stand is within the base frame.", "check": "Sight down from the top step. A top step that cantilevers past the casters is a finding."}, {"id": "C13", "g": "C", "cite": "1910.23(e)(3)(i)", "tags": ["MP"], "sev": "yellow", "auto": "steps", "req": "Steps of mobile ladder stand platforms meet 1910.23(e)(2)(i): rise no more than 10 inches, depth at least 7 inches, stringer no more than 60 degrees. Steeper slopes or vertical rungs are allowed only where the employer shows this is not feasible and the unit is stabilized against overturning.", "check": "Measure largest rise, shallowest depth and stringer angle. If steeper, ask why and check for stabilizers."}, {"id": "C14", "g": "C", "cite": "1910.23(e)(3)(ii)", "tags": ["MP_4to10"], "sev": "red", "auto": "platRail36", "req": "Platforms 4 to 10 ft high have handrails at least 36 inches high and midrails in the platform area.", "check": "Measure top rail and midrail on every exposed side and end of the platform."}, {"id": "C15", "g": "C", "cite": "1910.23(e)(3)(iii)", "tags": ["MP_gt10"], "sev": "red", "req": "Platforms above 10 ft have guardrails and toeboards on the exposed sides and ends. Guardrails must meet 1910.29(b) and toeboards 1910.29(k).", "check": "Confirm guardrails and toeboards on every exposed side and end, then complete section E."}, {"id": "C16", "g": "C", "cite": "1910.23(e)(3)(iv)", "tags": ["mobile"], "sev": "yellow", "req": "Chains or removable gates in place of handrails or guardrails are used only in special-use applications.", "check": "Mark N/A if no chains or gates are used. If used, record why and whether they are kept closed during work."}, {"id": "D1", "g": "D", "cite": "1910.28(b)(1)(i)", "tags": ["FP_ge4"], "sev": "red", "req": "Each unprotected side or edge 4 ft or more above a lower level is protected by a guardrail system, safety net system or personal fall protection system.", "check": "Walk the full perimeter. Record each open side, including the side facing the work."}, {"id": "D2", "g": "D", "cite": "1910.28(b)(3)(iv)", "tags": ["FP_ladder"], "sev": "red", "req": "A ladderway platform hole has a guardrail and toeboards on all exposed sides, with a self-closing gate or an offset at the entrance.", "check": "Check the ladder arrival point. An open gap with no gate or offset is a finding."}, {"id": "D3", "g": "D", "cite": "1910.28(b)(11)(i)", "tags": ["FP_stairs", "FP_ship"], "sev": "red", "req": "Each unprotected side or edge of a stair landing 4 ft or more above a lower level has a guardrail or stair rail system.", "check": "Check intermediate and top landings."}, {"id": "D4", "g": "D", "cite": "1910.28(b)(11)(ii)", "tags": ["FP_stairs"], "sev": "red", "req": "Each flight with at least 3 treads and at least 4 risers has stair rail systems and handrails as the standard's table requires for the stair width and enclosure.", "check": "Record which sides are open or enclosed and which rails are present."}, {"id": "D5", "g": "D", "cite": "1910.28(c)", "tags": ["guardrail"], "sev": "yellow", "req": "Where employees are exposed to falling objects, the employer uses toeboards, screens or guardrails, canopies, or barricades below, and requires head protection.", "check": "Ask whether people work beneath or beside the platform. Note tools or parts staged near open edges."}, {"id": "E1", "g": "E", "cite": "1910.29(b)(1)", "tags": ["guardrail"], "sev": "red", "auto": "guardRail", "req": "Top rail height is 42 inches, plus or minus 3 inches, above the walking-working surface. Heights above 45 inches are allowed if all other guardrail criteria are met.", "check": "Measure at several points, from the deck surface to the top of the top rail."}, {"id": "E2", "g": "E", "cite": "1910.29(b)(2)", "tags": ["guardrail"], "sev": "red", "auto": "opening", "req": "Midrails are installed midway between top rail and deck, or intermediate members leave no opening wider than 19 inches.", "check": "Measure midrail height and the largest clear opening in the rail system."}, {"id": "E3", "g": "E", "cite": "1910.29(b)(3)", "tags": ["guardrail"], "sev": "red", "req": "The guardrail withstands, without failure, at least 200 lb applied downward or outward within 2 inches of the top edge at any point.", "check": "Not verifiable visually. Rate Unable to verify unless a calibrated test was performed. Note any rail that moves under hand pressure."}, {"id": "E4", "g": "E", "cite": "1910.29(b)(4)", "tags": ["guardrail"], "sev": "yellow", "req": "Under a 200 lb downward test load, the top rail does not deflect below 39 inches above the deck.", "check": "Rate with E3."}, {"id": "E5", "g": "E", "cite": "1910.29(b)(5)", "tags": ["guardrail"], "sev": "yellow", "req": "Midrails and other intermediate members withstand at least 150 lb applied downward or outward at any point.", "check": "Rate with E3. Note loose or single-fastener midrails."}, {"id": "E6", "g": "E", "cite": "1910.29(b)(6), (b)(7)", "tags": ["guardrail"], "sev": "yellow", "req": "Guardrails are smooth-surfaced, and rail ends do not overhang terminal posts where the overhang is a projection hazard.", "check": "Check for sharp edges, snag points and open tube ends at walking height."}, {"id": "E7", "g": "E", "cite": "1910.29(b)(8), (b)(9)", "tags": ["guardrail"], "sev": "yellow", "req": "Top rails and midrails are at least 0.25 inch thick or in diameter, and are not steel or plastic banding.", "check": "Check rail material and size."}, {"id": "E8", "g": "E", "cite": "1910.29(k)(1)(ii)-(iv)", "tags": ["toeboard"], "sev": "yellow", "auto": "toe", "req": "Toeboards are at least 3.5 inches tall, have no more than a 0.25-inch gap above the deck, and have no opening larger than 1 inch.", "check": "Measure toeboard height and the gap at the deck."}, {"id": "E9", "g": "E", "cite": "1910.29(k)(1)(vi)", "tags": ["toeboard"], "sev": "yellow", "req": "Toeboards withstand at least 50 lb applied downward or outward at any point.", "check": "Note loose or tack-welded toeboards. Rate Unable to verify unless tested."}, {"id": "F1", "g": "F", "cite": "1910.25(b)(2)", "tags": ["FP_stairs", "FP_ship"], "sev": "yellow", "req": "Vertical clearance above any stair tread to an overhead obstruction is at least 6 ft 8 in, measured from the tread's leading edge.", "check": "Check for beams, ducts or aircraft structure over the stair."}, {"id": "F2", "g": "F", "cite": "1910.25(b)(3)", "tags": ["FP_stairs", "FP_ship"], "sev": "yellow", "req": "Riser heights and tread depths are uniform between landings.", "check": "Measure each riser and tread in the flight."}, {"id": "F3", "g": "F", "cite": "1910.25(b)(4)", "tags": ["FP_stairs", "FP_ship"], "sev": "yellow", "auto": "landing", "req": "Landings and platforms are at least as wide as the stair and at least 30 inches deep in the direction of travel.", "check": "Measure top landing depth and width."}, {"id": "F4", "g": "F", "cite": "1910.25(b)(6)", "tags": ["FP_stairs", "FP_ship"], "sev": "red", "req": "Each stair supports at least five times the normal anticipated live load, and never less than a 1,000 lb concentrated load at any point.", "check": "Needs design data or testing. Without them, rate Unable to verify."}, {"id": "F5", "g": "F", "cite": "1910.25(c)(1)", "tags": ["FP_stairs"], "sev": "yellow", "auto": "stairAngle", "req": "Standard stairs are installed between 30 and 50 degrees from horizontal.", "check": "Measure the stringer angle with a digital angle finder."}, {"id": "F6", "g": "F", "cite": "1910.25(c)(2), (c)(3), (c)(5)", "tags": ["FP_stairs"], "sev": "yellow", "auto": "stairRT", "req": "Risers are no more than 9.5 inches and treads at least 9.5 inches deep. Stairs installed before January 17, 2017 are deemed compliant if they meet Table D-1 or the 30 to 50 degree angle.", "check": "Measure the largest riser and smallest tread. Most legacy units fall under the pre-2017 provision."}, {"id": "F7", "g": "F", "cite": "1910.25(c)(4)", "tags": ["FP_stairs"], "sev": "yellow", "auto": "stairWidth", "req": "Standard stairs are at least 22 inches wide between vertical barriers.", "check": "Measure clear width between rails or stringers."}, {"id": "F8", "g": "F", "cite": "1910.29(f)(1)(i)", "tags": ["FP_stairs"], "sev": "yellow", "auto": "handrail", "req": "Handrails are 30 to 38 inches high, measured from the leading edge of the tread to the top of the rail.", "check": "Measure at several treads. A stair rail's top rail may serve as the handrail only if it is 36 to 38 inches high and meets the other handrail rules [1910.29(f)(1)(iii)]."}, {"id": "F9", "g": "F", "cite": "1910.29(f)(1)(ii)", "tags": ["FP_stairs"], "sev": "yellow", "auto": "stairRail", "req": "Stair rail systems are at least 30 inches high if installed before January 17, 2017, and at least 42 inches if installed on or after that date.", "check": "Measure from tread leading edge to top of rail. Confirm the install date with the customer."}, {"id": "F10", "g": "F", "cite": "1910.29(f)(2), (3), (5), (6)", "tags": ["FP_stairs", "FP_ship"], "sev": "yellow", "req": "Handrails have at least 2.25 inches of finger clearance, a shape employees can grasp firmly, and smooth surfaces, and rail ends do not create projection hazards.", "check": "Check clearance to walls and posts, the rail profile, burrs and sharp or protruding ends."}, {"id": "F11", "g": "F", "cite": "1910.29(f)(4)", "tags": ["FP_stairs", "FP_ship"], "sev": "yellow", "req": "No opening in a stair rail system exceeds 19 inches at its least dimension.", "check": "Measure the largest opening below the stair rail."}, {"id": "F12", "g": "F", "cite": "1910.29(f)(7)", "tags": ["FP_stairs", "FP_ship"], "sev": "red", "req": "Handrails and stair rail top rails withstand at least 200 lb downward or outward within 2 inches of the top edge.", "check": "Rate Unable to verify unless tested. Note rails that move under hand pressure."}, {"id": "F13", "g": "F", "cite": "1910.25(b)(8), (e)", "tags": ["FP_ship"], "sev": "yellow", "auto": "shipStair", "req": "Ship stairs are used only where standard stairs are not feasible, slope 50 to 70 degrees, have open risers with a 6.5 to 12 inch rise, treads at least 4 inches deep and at least 18 inches wide.", "check": "Measure angle, rise, tread depth and width. Ask why standard stairs were not used."}, {"id": "F14", "g": "F", "cite": "1910.28(b)(11)(iii)", "tags": ["FP_ship"], "sev": "red", "req": "Ship stairs have handrails on both sides.", "check": "Confirm a handrail on each side."}, {"id": "G1", "g": "G", "cite": "1910.23(b)(2)", "tags": ["FP_ladder"], "sev": "yellow", "auto": "rungSpacing", "req": "Rungs are spaced 10 to 14 inches apart, centerline to centerline.", "check": "Measure several rung spacings."}, {"id": "G2", "g": "G", "cite": "1910.23(b)(4)", "tags": ["FP_ladder"], "sev": "yellow", "auto": "rungWidth", "req": "Fixed ladder rungs have a minimum clear width of 16 inches.", "check": "Measure between side rails."}, {"id": "G3", "g": "G", "cite": "1910.23(d)(2)", "tags": ["FP_ladder"], "sev": "yellow", "auto": "rungBehind", "req": "At least 7 inches from rung centerline to the nearest permanent object behind the ladder.", "check": "Measure toe clearance behind rungs."}, {"id": "G4", "g": "G", "cite": "1910.23(d)(4), (d)(7)", "tags": ["FP_ladder"], "sev": "red", "auto": "railExt", "req": "Side rails of through or side-step ladders, or grab bars, extend at least 42 inches above the landing served.", "check": "Measure from landing surface to top of side rails or grab bars."}, {"id": "G5", "g": "G", "cite": "1910.23(d)(13)", "tags": ["FP_ladder"], "sev": "yellow", "req": "Ladders without cages or wells have at least 15 inches clear each side of centerline and 30 inches on the climbing side.", "check": "Check for obstructions beside and in front of the ladder."}, {"id": "G6", "g": "G", "cite": "1910.28(b)(9)", "tags": ["FP_ladder_gt24"], "sev": "red", "req": "Fixed ladders extending more than 24 ft have fall protection. Installed before November 19, 2018: a personal fall arrest system, ladder safety system, cage or well. Installed on or after that date, or any replaced section: a personal fall arrest or ladder safety system. By November 18, 2036 every such ladder needs a personal fall arrest or ladder safety system.", "check": "Record ladder length and the fall protection provided."}, {"id": "H1", "g": "H", "cite": "1910.30(b)(1)", "tags": ["all"], "sev": "yellow", "req": "Each employee is trained in the proper care, inspection, storage and use of the equipment before using it.", "check": "Ask for training records or a sign-off sheet covering these units."}, {"id": "H2", "g": "H", "cite": "1910.30(a)", "tags": ["guardrail"], "sev": "yellow", "req": "Employees exposed to fall hazards who are required to be trained (including personal fall protection users) are trained by a qualified person before exposure.", "check": "Ask who delivers fall hazard training and how often."}, {"id": "H3", "g": "H", "cite": "1910.23(b)(11), (b)(12)", "tags": ["ladder"], "sev": "yellow", "req": "Employees face the unit when climbing and keep at least one hand on it while climbing up or down.", "check": "Observe climbing. Steps without handholds make this hard to do."}, {"id": "H4", "g": "H", "cite": "1910.23(b)(13)", "tags": ["ladder"], "sev": "yellow", "req": "No employee carries an object or load that could cause a loss of balance while climbing.", "check": "Observe how tools and parts reach the deck. Note whether a tool tray or hoist is needed."}, {"id": "H5", "g": "H", "cite": "1910.30(c)", "tags": ["all"], "sev": "yellow", "req": "Employees are retrained when workplace or equipment changes make earlier training obsolete, or when an employee's use of the equipment shows they lack the needed understanding or skill.", "check": "Ask whether training was refreshed after units were modified or replaced, and how misuse is handled."}, {"id": "I1", "g": "I", "cite": "Observation", "tags": ["all"], "sev": "red", "req": "Welds are free of cracks, porosity, incomplete fusion and undercut, and prior weld repairs are sound.", "check": "Inspect every primary joint with a light and mirror, especially leg-to-base, stringer and rail-post welds. Photograph anything questionable."}, {"id": "I2", "g": "I", "cite": "Observation", "tags": ["all"], "sev": "red", "req": "Structural members are not bent, dented, twisted or cracked, and the frame is square and not racked.", "check": "Sight along members. Check diagonals for racking."}, {"id": "I3", "g": "I", "cite": "Observation", "tags": ["all"], "sev": "yellow", "req": "Fasteners, pins and hardware are present, tight and secured.", "check": "Check every bolted connection, pin and clip."}, {"id": "I4", "g": "I", "cite": "Observation", "tags": ["mobile"], "sev": "yellow", "req": "Casters swivel and roll freely, wheels are not flat-spotted or chunked, and stems or mounting plates are tight and undamaged.", "check": "Lift-check play, spin each wheel, check brake engagement."}, {"id": "I5", "g": "I", "cite": "Observation (ANSI A14.7)", "tags": ["all"], "sev": "yellow", "req": "The unit is marked with its rated load, an ID number and the date of last inspection.", "check": "Note what markings exist. Unmarked units cannot show their capacity to users."}, {"id": "I6", "g": "I", "cite": "Observation", "tags": ["all"], "sev": "yellow", "req": "Coatings are intact and base metal is not corroded, including at dissimilar-metal joints.", "check": "Note coating loss and white or red corrosion product."}, {"id": "I7", "g": "I", "cite": "Observation", "tags": ["all"], "sev": "yellow", "req": "The unit sits level and stable on the floor where it is used.", "check": "Check for rocking, floor slope, drains or trench covers under casters."}, {"id": "J1", "g": "J", "cite": "1910.28(b)(1)(i)", "tags": ["inpos"], "sev": "red", "req": "In its working position, the gap between the deck edge and the equipment does not leave an unprotected edge an employee could fall through, or that edge is protected by rails, deck extensions, sliders or another fall protection means.", "check": "Measure the largest gap at the work side in each position the unit is used. Note where the equipment curves or tapers away from the deck."}, {"id": "J2", "g": "J", "cite": "1910.28(b)(1)(i)", "tags": ["inpos"], "sev": "red", "req": "Sides left open to reach the work face the equipment closely, and every other side or end 4 ft or more above the floor is guarded.", "check": "With the unit in place, walk the deck. Record each open side, what it faces, and whether removable rails are put back when not needed."}, {"id": "J3", "g": "J", "cite": "Observation", "tags": ["inpos"], "sev": "red", "req": "Employees can reach the work from the deck without leaning over, standing on or climbing the rails.", "check": "Watch a technician do the task. Note reach distance, overhead work and any use of the rails as a step."}, {"id": "J4", "g": "J", "cite": "Observation", "tags": ["inpos"], "sev": "yellow", "req": "The unit rests against the equipment through bumpers or pads, does not load or damage it, and does not shift as people work.", "check": "Check bumper condition and contact points, and watch for the unit walking away from the equipment during work."}]};

function orderedStands(aid){
  const a=S.list[aid]; if(!a) return []; const map=standsOf(aid);
  const seen=new Set(); const out=[];
  for(const id of a.order||[]) if(map[id]&&!seen.has(id)){out.push(map[id]);seen.add(id)}
  for(const id of Object.keys(map)) if(!seen.has(id)) out.push(map[id]);

}

function mark(path,op="set"){if(!inViewer){saveCache();return}const d=dirty.get(path);dirty.set(path,{op,seq:(d?d.seq:0)+1});saveCache();scheduleFlush();renderSync()}
function touchA(aid){const a=S.list[aid];if(!a)return;a.updated=Date.now();mark(aPath(aid))}
function touchS(s,aid=S.cur){
  mark(sPath(aid,s.uid));
  const a=S.list[aid]; if(!a) return;
  const sum=summaryOf(aid); if(JSON.stringify(sum)!==JSON.stringify(a.summary||{})){a.summary=sum;touchA(aid)}
}
function summaryOf(aid){const c={n:0,red:0,yellow:0,gray:0,green:0,none:0};for(const s of orderedStands(aid)){c.n++;c[standRating(s).color]++}return c}

        else { const body=await bodyFor(path); if(body===null){dirty.delete(path);continue} await db.doc(path).set(body); }
        const now=dirty.get(path); if(now&&now.seq===seq) dirty.delete(path);
        failCount=0; reachable=true;
      }catch(e){ onWriteError(e); break; }
    }

    flushing=false; saveCache(); renderSync();

}
function onWriteError(e){

  if(code==="quota_exceeded") toast("Storage for this tool is full. Delete old assessments to free space.");
  failCount++;
}
async function bodyFor(path){
  const p=path.split("/");
  if(p.length===2){const a=S.list[p[1]];if(!a)return null;return {meta:a.meta,order:a.order||[],created:a.created||Date.now(),updated:a.updated||Date.now(),example:!!a.example,summary:a.summary||{}}}
  const s=(S.stands[p[1]]||{})[p[3]]; if(!s) return null;
  await uploadPending(s);
  return serializeStand(s);
}
function serializeStand(s){
  const o=clone(s); delete o.uid;
  o.photos=(s.photos||[]).filter(p=>p.id).map(p=>({id:p.id,caption:p.caption||"",pid:p.pid||p.id}));
  return o;
}
async function uploadPending(s){
  if(!assets) return;
  for(const p of s.photos||[]){
    if(p.id||!p.data) continue;
    const blob=await (await fetch(p.data)).blob();
    const r=await assets.upload(blob,{type:"image/jpeg"});
    p.id=r.id; delete p.data; saveCache();
  }
}
const photoSrc = p => p.id ? "/_blob/"+p.id : (p.data||"");

/* ---------- live sync ---------- */
let unsubList=null, unsubStands=null, subAid=null, loadTimer=null;
function startSync(){
  loadTimer=setTimeout(()=>{if(!reachable){loadTimedOut=true;renderSync();renderBanners()}},10000);
  unsubList=db.collection("assessments").onSnapshot(snap=>{
    let changed=false; const seen=new Set();
    for(const d of snap.docs){
      seen.add(d.id); if(dirty.has(aPath(d.id))) continue;
      const inc=clone(d.data()); const loc=S.list[d.id];
      if(!loc||JSON.stringify(loc)!==JSON.stringify(inc)){S.list[d.id]=inc;changed=true}
    }
    if(!snap.metadata.fromCache){
      if(!reachable) changed=true;
      reachable=true; loadTimedOut=false; clearTimeout(loadTimer);
      for(const id of Object.keys(S.list)) if(!seen.has(id)&&!dirty.has(aPath(id))){delete S.list[id];delete S.stands[id];changed=true}
    }
    if(S.cur&&!S.list[S.cur]){S.cur=defaultAid();changed=true}
    if(!S.cur&&Object.keys(S.list).length){S.cur=defaultAid();changed=true}
    if(changed){saveCache();subscribeStands();softRender()}
    renderSync();
  }, err=>{ if(err&&err.code==="revoked"){readOnly=true} renderSync(); renderBanners(); });
  subscribeStands();
}
function subscribeStands(){
  if(mode!=="db"||subAid===S.cur) return;
  if(unsubStands){unsubStands();unsubStands=null}
  subAid=S.cur; if(!S.cur) return;
  const aid=S.cur;
  unsubStands=db.collection(`assessments/${aid}/stands`).onSnapshot(snap=>{
    const local=standsOf(aid); const seen=new Set(); let changed=false;
    for(const d of snap.docs){
      seen.add(d.id); if(dirty.has(sPath(aid,d.id))) continue;
      const inc=clone(d.data()); inc.uid=d.id; const loc=local[d.id];
      inc.photos=[...(inc.photos||[]),...((loc&&loc.photos)||[]).filter(p=>!p.id)];
      if(!loc||JSON.stringify(loc)!==JSON.stringify(inc)){local[d.id]=inc;changed=true}
    }
    if(!snap.metadata.fromCache) for(const id of Object.keys(local)) if(!seen.has(id)&&!dirty.has(sPath(aid,id))){delete local[id];changed=true}
    if(changed){saveCache();softRender()}
  }, ()=>{});
}
function defaultAid(){const ids=Object.keys(S.list);ids.sort((a,b)=>(S.list[b].updated||0)-(S.list[a].updated||0));return ids[0]||null}

/* ---------- applicability and auto checks ---------- */
function tagsFor(s){
  const H=num(s.m.H)??0, t=new Set(["all"]);
  if(s.type==="MS"||s.type==="MP"){t.add("mobile");t.add("ladder");if(H>=4)t.add("mobile_ge4")}
  if(s.type==="MS"){t.add("MS");if(H>10){t.add("MS_gt10");if((num(s.m.topDepth)??0)>=20)t.add("MS_gt10_deep")}}
  if(s.type==="MP"){t.add("MP");if(H>=4&&H<=10)t.add("MP_4to10");if(H>10)t.add("MP_gt10")}
  if(s.type==="FP"){if(H>=4)t.add("FP_ge4");
    if(s.access==="stairs")t.add("FP_stairs");if(s.access==="ship")t.add("FP_ship");
    if(s.access==="ladder"){t.add("FP_ladder");t.add("ladder");if(H>24)t.add("FP_ladder_gt24")}}
  if(s.pos==="in")t.add("inpos");
  if(t.has("MP_gt10")||t.has("FP_ge4"))t.add("guardrail");
  if(t.has("MP_gt10")||t.has("FP_ge4")||t.has("MS_gt10_deep"))t.add("toeboard");
  return t;
}
const itemsFor = s => {const t=tagsFor(s);return ITEMS.filter(i=>i.tags.some(x=>t.has(x)))};
const measuresFor = s => {const t=tagsFor(s);return MEAS.filter(m=>m.tags.some(x=>t.has(x)))};
const range=(v,lo,hi)=>v>=lo&&v<=hi;
function autoCheck(id,s){
  const m=k=>num(s.m[k]); const it=ITEM[id]; if(!it||!it.auto) return null;
  const R=(ok,msg)=>({s:ok?"C":"NC",msg});
  switch(it.auto){
    case "uniformRise":{const a=m("riseMax"),b=m("riseMin");if(a==null||b==null)return null;return {s:null,msg:`Rise spread ${fmt(a-b,2)} in (${fmt(b,2)}–${fmt(a,2)} in). Judge uniformity yourself.`}}
    case "stepWidth":{const v=m("stepWidth");if(v==null)return null;return R(v>=16,`Step width ${fmt(v,2)} in, need ≥ 16 in`)}
    case "casters":{const l=m("mil"),w=m("unitWt"),n=m("casters"),c=m("casterRating");if(l==null||w==null||!n)return null;const need=(4*l+w)/n;if(c==null)return {s:null,msg:`Each caster must be rated ≥ ${fmt(need,0)} lb. Caster rating unknown.`};return R(c>=need,`Caster rated ${fmt(c,0)} lb, need ≥ ${fmt(need,0)} lb each`)}
    case "stepRail":{const v=m("stepRail");if(v==null)return null;return R(range(v,29.5,37),`Step handrail ${fmt(v,2)} in, need 29.5–37 in`)}
    case "baseRatio":{const h=m("H"),b=m("baseMin");if(h==null||b==null)return null;const max=4*b/12;return R(h<=max,`Height ${fmt(h,2)} ft, limit ${fmt(max,2)} ft (4 × ${fmt(b,1)} in base) without outriggers`)}
    case "steps":{const r=m("riseMax"),d=m("depthMin"),a=m("stringerAngle");if(r==null&&d==null&&a==null)return null;const bad=[];if(r!=null&&r>10)bad.push(`rise ${fmt(r,2)} in > 10`);if(d!=null&&d<7)bad.push(`depth ${fmt(d,2)} in < 7`);if(a!=null&&a>60)bad.push(`slope ${fmt(a,1)}° > 60`);return R(!bad.length,bad.length?bad.join("; "):"Rise, depth and slope within limits")}
    case "topRail":{const v=m("topRail");if(v==null)return null;return R(v>=36,`Top step handrail ${fmt(v,2)} in, need ≥ 36 in`)}
    case "platRail36":{const v=m("platRail"),mr=m("midRail");if(v==null)return null;if(v<36)return R(false,`Top rail ${fmt(v,2)} in, need ≥ 36 in`);if(mr==null||mr<=0)return R(false,`Top rail ${fmt(v,2)} in OK; no midrail recorded`);return R(true,`Top rail ${fmt(v,2)} in, midrail ${fmt(mr,2)} in`)}
    case "guardRail":{const v=m("platRail");if(v==null)return null;if(v<39)return R(false,`Top rail ${fmt(v,2)} in, need 39–45 in`);if(v>45)return {s:"C",msg:`Top rail ${fmt(v,2)} in (above 45 in only if all other 1910.29(b) criteria are met)`};return R(true,`Top rail ${fmt(v,2)} in, within 42 ± 3 in`)}
    case "opening":{const o=m("maxOpening"),t=m("platRail"),mr=m("midRail");if(o==null)return null;let msg=`Largest opening ${fmt(o,2)} in, max 19 in`;if(t!=null&&mr!=null)msg+=` · midrail ${fmt(mr,1)} in, midway is ${fmt(t/2,1)} in`;return R(o<=19,msg)}
    case "toe":{const h=m("toeH"),g=m("toeGap");if(h==null&&g==null)return null;const bad=[];if(h===0)bad.push("no toeboard");else if(h!=null&&h<3.5)bad.push(`height ${fmt(h,2)} in < 3.5`);if(g!=null&&g>0.25)bad.push(`gap ${fmt(g,2)} in > 0.25`);return R(!bad.length,bad.length?bad.join("; "):"Toeboard height and gap within limits")}
    case "landing":{const v=m("landingDepth");if(v==null)return null;return R(v>=30,`Landing depth ${fmt(v,1)} in, need ≥ 30 in`)}
    case "stairAngle":{const v=m("stairAngle");if(v==null)return null;return R(range(v,30,50),`Stair angle ${fmt(v,1)}°, need 30–50°`)}
    case "stairRT":{const r=m("stairRise"),t=m("stairTread"),a=m("stairAngle");if(r==null&&t==null)return null;const ok=(r==null||r<=9.5)&&(t==null||t>=9.5);if(ok)return R(true,"Riser and tread within 9.5 in limits");if(s.pre2017&&a!=null&&range(a,30,50))return {s:"C",msg:"Outside 9.5 in limits, but a pre-2017 stair at 30–50° is deemed compliant under 1910.25(c)(5)"};return R(false,`Riser ${fmt(r,2)} in / tread ${fmt(t,2)} in outside limits`+(s.pre2017?"; check Table D-1":""))}
    case "stairWidth":{const v=m("stairWidth");if(v==null)return null;return R(v>=22,`Width ${fmt(v,1)} in, need ≥ 22 in`)}
    case "handrail":{const v=m("handrailH");if(v==null)return null;return R(range(v,30,38),`Handrail ${fmt(v,2)} in, need 30–38 in`)}
    case "stairRail":{const v=m("stairRailH");if(v==null)return null;const need=s.pre2017?30:42;return R(v>=need,`Stair rail ${fmt(v,2)} in, need ≥ ${need} in`)}
    case "shipStair":{const a=m("stairAngle"),r=m("stairRise"),t=m("stairTread"),w=m("stairWidth");if(a==null&&r==null&&t==null&&w==null)return null;const bad=[];if(a!=null&&!range(a,50,70))bad.push(`angle ${fmt(a,1)}°`);if(r!=null&&!range(r,6.5,12))bad.push(`rise ${fmt(r,2)} in`);if(t!=null&&t<4)bad.push(`tread ${fmt(t,2)} in`);if(w!=null&&w<18)bad.push(`width ${fmt(w,1)} in`);return R(!bad.length,bad.length?"Outside limits: "+bad.join(", "):"Angle, rise, tread and width within limits")}
    case "rungSpacing":{const v=m("rungSpacing");if(v==null)return null;return R(range(v,10,14),`Rung spacing ${fmt(v,2)} in, need 10–14 in`)}
    case "rungWidth":{const v=m("rungWidth");if(v==null)return null;return R(v>=16,`Clear width ${fmt(v,2)} in, need ≥ 16 in`)}
    case "rungBehind":{const v=m("rungBehind");if(v==null)return null;return R(v>=7,`Clearance ${fmt(v,2)} in, need ≥ 7 in`)}
    case "railExt":{const v=m("railExt");if(v==null)return null;return R(v>=42,`Extension ${fmt(v,1)} in, need ≥ 42 in`)}
  }
  return null;
}
function autoAll(s){
  for(const it of ITEMS){ if(!it.auto) continue; const a=autoCheck(it.id,s); const r=s.r[it.id];
    if(a&&a.s){ if(!r||!r.s||r.auto) s.r[it.id]={s:a.s,note:r?r.note||"":"",sev:r?r.sev||null:null,auto:true} }
    else if(r&&r.auto){ s.r[it.id]={...r,s:"",auto:false} } }
}
const sevOf=(it,r)=>(r&&r.sev)||it.sev;
function standRating(s){
  const items=itemsFor(s); let nc=0,ncRed=0,uv=0,done=0;
  for(const it of items){const r=s.r[it.id]; if(r&&r.s){done++; if(r.s==="NC"){nc++; if(sevOf(it,r)==="red")ncRed++} if(r.s==="UV")uv++}}
  let color=ncRed?"red":nc?"yellow":uv?"gray":"green";
  if(!ncRed&&done<items.length) color = nc ? "yellow" : "none";
  if(!items.length) color="none";
  return {color,nc,ncRed,uv,done,total:items.length};
}

function renderRail(){

function measResults(s,key){
  const out=[];
  for(const it of itemsFor(s)){ if(!it.auto||!(AUTO_KEYS[it.auto]||[]).includes(key)) continue; const a=autoCheck(it.id,s); if(!a) continue; out.push(`<span class="${a.s==="C"?"pass":a.s==="NC"?"fail":""}">${a.s==="C"?"✓":a.s==="NC"?"✗":"•"} ${it.id}: ${esc(a.msg)}</span>`) }
  return out.join("");
}
function panelMeasure(P,s){
  const ms=measuresFor(s);

  <div class="mgrid">${ms.map(m=>`<div class="mfield"><label for="m-${m.key}">${esc(m.label)}</label><div class="minput"><input id="m-${m.key}" inputmode="decimal" enterkeyhint="next" data-mk="${m.key}" value="${esc(s.m[m.key]??"")}"><span class="unit">${m.unit}</span></div>${m.hint?`<span class="hint">${esc(m.hint)}</span>`:""}<div class="mres" id="mr-${m.key}">${measResults(s,m.key)}</div></div>`).join("")}</div>

    el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const n=inputs[i+1];if(n)n.focus();else el.blur()}});
    el.addEventListener("change",()=>{changed(s);if(["H","topDepth"].includes(el.dataset.mk)){const before=ms.map(m=>m.key).join();const after=measuresFor(s).map(m=>m.key).join();if(before!==after)setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;panelMeasure(P,s);if(id&&$(id))$(id).focus();toast("Height changed which items apply")},0)}});
  });
  $("b-tochk").onclick=()=>{ui.sub="checklist";renderStands();window.scrollTo(0,0)};

function itemVisible(it,s){const r=s.r[it.id];if(ui.filter==="todo")return !(r&&r.s);if(ui.filter==="find")return r&&(r.s==="NC"||r.s==="UV");return true}

function itemHTML(it,s){

  </div>`;

function bindItem(row,s,P){

  row.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
    const r=s.r[id]||{note:"",sev:null}; r.s=(r.s===b.dataset.s)?"":b.dataset.s; r.auto=false; s.r[id]=r;

let photoCtx=null;
function pickPhoto(s,caption,src){photoCtx={sid:s.uid,aid:S.cur,caption};const inp=$(src==="cam"?"f-cam":"f-lib");inp.value="";inp.click()}
["f-cam","f-lib"].forEach(id=>$(id).addEventListener("change",e=>{if(!photoCtx)return;addPhotos(photoCtx,[...e.target.files]);}));
function addPhotos(ctx,files){
  if(!files.length) return; const s=standsOf(ctx.aid)[ctx.sid]; if(!s) return; let left=files.length;
  toast(files.length>1?`Adding ${files.length} photos…`:"Adding photo…");
  files.forEach((f,i)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      s.photos=s.photos||[]; s.photos.push({pid:uid(),data:c.toDataURL("image/jpeg",0.72),caption:ctx.caption||""}); done()};img.onerror=done;img.src=rd.result};rd.onerror=done;rd.readAsDataURL(f)});
  function done(){ if(--left===0){ touchS(s,ctx.aid); toast(`Photo saved to ${s.code}`); if(ui.view==="stands") { if(ui.sub==="photos") renderStands(); else { renderCounts(s); const row=document.querySelector(`.item[data-item="${(ctx.caption||"").split(" ")[0]}"] [data-photo]`); if(row){const n=(s.photos||[]).filter(p=>(p.caption||"").startsWith(ctx.caption.split(" ")[0]+" ")).length;row.textContent=`📷 Add photo (${n})`} } } } }
}

   <p>JE recommends an in-position assessment, with each unit set up at the equipment it serves and used as it is during normal work, before these findings are relied on for fall protection decisions.</p>`:""}

  ${rows.map(({s,r})=>{const f=findings(s);const pn=pnum(s);const meas=measuresFor(s).filter(m=>s.m[m.key]!==undefined&&s.m[m.key]!=="");

    ${(s.photos||[]).length?`<div class="rphotos" style="margin-top:10pt">${s.photos.map((p,i)=>`<figure class="keep"><img src="${photoSrc(p)}" alt="" crossorigin="anonymous"><figcaption><b>Photo ${i+1}</b>${(p.caption||"").replace(/[\s·]+$/,"")?" · "+esc(p.caption.replace(/[\s·]+$/,"")):""}</figcaption></figure>`).join("")}</div>`:""}
    ${meas.length?`<h3>Measurements</h3><div class="tw"><table><tbody>${meas.map(m=>`<tr><th style="width:55%">${esc(m.label)}</th><td class="mono">${esc(s.m[m.key])} ${m.unit}</td></tr>`).join("")}</tbody></table></div>`:""}
    <h3>Findings</h3>
    ${(()=>{const nc=f.filter(it=>s.r[it.id].s==="NC"), uv=f.filter(it=>s.r[it.id].s==="UV");

function precheckHTML(){
  const a=curA(); const list=orderedStands(S.cur); const iss=[];
  if(!a.meta.customer) iss.push(`<li>Customer name is blank. <button type="button" data-goinfo>Add it</button></li>`);
  if(!list.length) iss.push(`<li>No stands added yet.</li>`);
  for(const s of list){const r=standRating(s);const left=r.total-r.done;
    if(left) iss.push(`<li>${esc(s.code)} ${esc(s.name||"")}: ${left} item${left>1?"s":""} not rated. <button type="button" data-jump="${s.uid}|checklist">Rate them</button></li>`);
    if(!s.action.type) iss.push(`<li>${esc(s.code)}: no recommendation chosen. <button type="button" data-jump="${s.uid}|action">Choose one</button></li>`);
    if(r.color==="red"&&!s.reported) iss.push(`<li>${esc(s.code)} is Red: record who you told on site. <button type="button" data-jump="${s.uid}|action">Add it</button></li>`);}
  const nfree=list.filter(s=>s.pos!=="in").length;
  const info = nfree ? `<p class="hint" style="margin:8px 0 0">${nfree===list.length?"All":nfree} unit${nfree>1?"s were":" was"} assessed free-standing. The report states that work-side fall protection at the equipment was not evaluated. To assess a unit in position, set it on its Details tab.</p>` : "";
  for(const s of list) if(s.pos==="in"&&!s.posNote) iss.push(`<li>${esc(s.code)} was assessed in position: name the equipment. <button type="button" data-jump="${s.uid}|details">Add it</button></li>`);
  const local = inViewer ? "" : `<p class="hint" style="margin:8px 0 0">This copy saves on this device only. To send this assessment to the office, use <b>Save assessment file</b> and email the file.</p>`;
  if(!iss.length) return `<div class="precheck ok noprint"><h3>Ready to send</h3><p class="hint" style="margin:0">Every stand is fully rated and has a recommendation.</p>${info}${local}</div>`;
  return `<div class="precheck noprint"><h3>Before you send</h3><ul>${iss.slice(0,12).join("")}${iss.length>12?`<li>…and ${iss.length-12} more</li>`:""}</ul><p class="hint" style="margin:6px 0 0">You can still download the report; unrated items show as "Not rated".</p>${info}${local}</div>`;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error("load"))};document.head.appendChild(s)})}

let pdfBusy=false;

}

/* ---------- backup ---------- */
async function blobToData(url){try{const b=await (await fetch(url)).blob();return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(b)})}catch(e){return null}}
async function exportBackup(){
  const a=curA(); if(!a){toast("Open an assessment first");return}
  toast("Preparing backup…");
  const stands=clone(orderedStands(S.cur));
  for(const s of stands) for(const p of s.photos||[]) if(p.id&&!p.data){p.data=await blobToData("/_blob/"+p.id)}
  const out=JSON.stringify({kind:"je-stand-assessment",version:2,exported:new Date().toISOString(),meta:a.meta,stands});
  const nm=`je-stand-assessment-${(a.meta.customer||"assessment").replace(/[^a-z0-9]+/gi,"-").toLowerCase()}-${a.meta.date||"undated"}.json`;
  if(inViewer){ if(!downloads){toast("Saving files isn't available in this view");return} try{await downloads.save({filename:nm,data:out});toast("Backup saved")}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the backup")} }
  else { try{const blob=new Blob([out],{type:"application/json"});const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=nm;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500);toast("Backup saved")}catch(e){toast("Couldn't save the backup")} }
}
function importBackup(d,quiet){
  if(!d||!d.meta||!Array.isArray(d.stands)) throw new Error("bad");
  const aid=uid(); const order=[]; const map={};
  for(const s0 of d.stands){ const s=Object.assign(blankStand(s0.code||"S-01"),clone(s0)); s.uid=s0.uid&&!map[s0.uid]?s0.uid:uid(); s.photos=(s0.photos||[]).filter(p=>p.data).map(p=>({pid:uid(),data:p.data,caption:p.caption||""})); map[s.uid]=s; order.push(s.uid) }
  S.list[aid]={meta:Object.assign(blankMeta(),d.meta),order,created:Date.now(),updated:Date.now(),example:!!d.example,summary:{}}; S.stands[aid]=map;
  S.list[aid].summary=summaryOf(aid);
  mark(aPath(aid)); for(const id of order) mark(sPath(aid,id));
  S.cur=aid; S.curStand=null; saveCache(); subscribeStands();
  if(!quiet){ render(); toast(inViewer?"Backup opened as a new assessment":"Assessment file opened as a new assessment"); }
}
$("f-import").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{importBackup(JSON.parse(rd.result))}catch(err){toast("That file isn't a JE stand assessment backup")}};rd.readAsText(f);e.target.value=""});

function confirmBox(title,msg,okLabel,onOk){
  const root=$("modal-root");
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="box"><h3 id="mt" style="font-size:22px">${esc(title)}</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="m-no">Cancel</button><button class="btn primary" type="button" id="m-ok">${esc(okLabel)}</button></div></div></div>`;
  const close=()=>{root.innerHTML=""};$("m-no").onclick=close;$("m-ok").onclick=()=>{close();onOk()};$("m-ok").focus();
}
let toastT;function toast(t){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2800)}
let wake=null, wakeWanted=false;
async function requestWake(){ if(!wakeWanted||wake||!navigator.wakeLock) return; try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}catch(e){wake=null} }
async function toggleWake(){ if(wake){wakeWanted=false;try{await wake.release()}catch(e){}wake=null;toast("Screen can sleep");return} wakeWanted=true; await requestWake(); toast(wake?"Screen stays on while this page is open":"This device won't keep the screen on from here") }
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){requestWake();if(mode==="db"){failCount=0;scheduleFlush(200)}}});

/* hide the bottom tab bar while the on-screen keyboard is up */
function kbCheck(){const ae=document.activeElement;const inp=!!(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&!/^(file|checkbox|radio|button)$/.test(ae.type||""));const vv=window.visualViewport;const shrunk=vv?vv.height<window.innerHeight*0.8:inp;document.body.classList.toggle("typing",inp&&shrunk)}
document.addEventListener("focusin",()=>setTimeout(kbCheck,250));
document.addEventListener("focusout",()=>setTimeout(kbCheck,150));
if(window.visualViewport) window.visualViewport.addEventListener("resize",kbCheck);
/* header height for sticky offsets */
function setHdr(){document.documentElement.style.setProperty("--hdr",$("top").offsetHeight+"px")}
try{new ResizeObserver(setHdr).observe($("top"))}catch(e){window.addEventListener("resize",setHdr)}
setHdr();

/* ---------- boot ---------- */
(function boot(){
  try{const u=JSON.parse(sessionStorage.getItem("je-ui")||"null");if(u){ui.view=u.view||"info";ui.sub=u.sub||"checklist"}}catch(e){}
  const had=loadCache();
  if(!inViewer){
    mode="local";
    if(!had && !migrateV1()) { importBackup(exampleAssessment(),true); }
    dirty.clear(); saveCache(); render(); return;
  }
  render();
  (async()=>{
    try{ db = await window.claude.use("db"); }catch(e){ db=null }
    if(!db){ mode="local"; if(!had&&!Object.keys(S.list).length) {} render(); return; }
    mode="db";
    try{ assets = await window.claude.use("assets"); }catch(e){ assets=null }
    try{ downloads = await window.claude.use("downloads"); }catch(e){ downloads=null }
    startSync(); scheduleFlush(200); render();
  })();
})();
